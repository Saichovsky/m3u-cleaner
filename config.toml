# Sample configuration for m3u-cleaner.
# A config file is mandatory — pass via --config=config.toml or CONFIG=config.toml.

# TV section: resolution filtering and TV-specific validation settings.
[tv]
playlist_urls = [
  "https://iptv-org.github.io/iptv/countries/ke.m3u",
  "https://iptv-org.github.io/iptv/countries/uk.m3u",
  "https://iptv-org.github.io/iptv/countries/us.m3u",
]

# Channels to exclude. Each word is a case-insensitive substring matched
# against a channel's EXTINF metadata (name, group, tvg-id). Any match drops
# the channel. Example: "bbc pashto" removes all BBC Pashto variants.
exclude_channels = [
  "BBC News Pashto",
  "XITE",
  # "cbeebies",
  # "al jazeera",
]

# Minimum resolution: TV channels explicitly below this are removed.
min_resolution_height = 720

# Per-request timeout (seconds) for TV stream validation.
timeout_seconds = 10

# Number of concurrent TV stream checks.
concurrency = 50

# Radio section: entries are tagged radio="true" in the output.
[radio]
playlist_urls = [
  "https://raw.githubusercontent.com/AlonDrilich/radio-playlists/refs/heads/main/countries/ke.m3u",
]

# Radio channels to exclude (same substring matching as the TV section).
exclude_channels = [
  "Ghetto Radio",
  "CARIBBEAN",
]

# Per-request timeout (seconds) for radio stream validation.
timeout_seconds = 15

# Number of concurrent radio stream checks.
concurrency = 20
